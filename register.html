<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadastro - NELCi Tech 3D</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#06080f;--card:#0d1017;--border:#1a1f2e;--green:#00ff88;--green-dim:#00cc6a;--blue:#3b82f6;--text:#e2e8f0;--muted:#64748b;--input-bg:#0f1219}
body{font-family:'Inter','Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
body::before{content:'';position:fixed;top:-50%;left:-50%;width:200%;height:200%;background:radial-gradient(ellipse at 30% 20%, rgba(0,255,136,0.06) 0%, transparent 50%),radial-gradient(ellipse at 70% 80%, rgba(59,130,246,0.05) 0%, transparent 50%);z-index:0}
.container{position:relative;z-index:1;width:100%;max-width:440px;padding:1.5rem}
.logo-section{text-align:center;margin-bottom:2.5rem}
.logo-icon{width:72px;height:72px;border-radius:20px;background:linear-gradient(135deg,var(--green),var(--blue));display:flex;align-items:center;justify-content:center;margin:0 auto 1.2rem;font-size:32px;font-weight:900;color:#000;box-shadow:0 8px 32px rgba(0,255,136,0.2)}
.logo-section h1{font-size:1.8rem;font-weight:800;letter-spacing:-0.5px}
.logo-section h1 span{color:var(--green)}
.logo-section p{color:var(--muted);font-size:0.9rem;margin-top:0.4rem}
.card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:2.2rem;box-shadow:0 4px 24px rgba(0,0,0,0.3)}
.error{background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.3);color:#f87171;padding:0.75rem 1rem;border-radius:12px;margin-bottom:1.2rem;font-size:0.85rem;display:flex;align-items:center;gap:0.5rem}
.error::before{content:'⚠';font-size:1rem}
.success{background:rgba(0,255,136,0.1);border:1px solid rgba(0,255,136,0.3);color:#00ff88;padding:0.75rem 1rem;border-radius:12px;margin-bottom:1.2rem;font-size:0.85rem;display:flex;align-items:center;gap:0.5rem}
.success::before{content:'✓';font-size:1rem}
.field{margin-bottom:1rem}
.field label{display:block;margin-bottom:0.5rem;font-size:0.8rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px}
.field input{width:100%;padding:0.85rem 1rem;background:var(--input-bg);border:1.5px solid var(--border);border-radius:12px;color:var(--text);font-size:0.95rem;transition:all 0.3s}
.field input:focus{border-color:var(--green);outline:none;box-shadow:0 0 0 3px rgba(0,255,136,0.1)}
.field input::placeholder{color:#334155}
.pass-wrap{position:relative}
.pass-wrap input{padding-right:2.8rem}
.pass-toggle{position:absolute;right:0.7rem;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--muted);cursor:pointer;font-size:1.1rem;padding:0.3rem;line-height:1;transition:color 0.2s}
.pass-toggle:hover{color:var(--text)}
.btn{width:100%;padding:0.9rem;background:var(--green);color:#000;border:none;border-radius:12px;font-size:1rem;font-weight:700;cursor:pointer;transition:all 0.3s;margin-top:0.8rem;letter-spacing:0.3px}
.btn:hover{background:var(--green-dim);box-shadow:0 4px 20px rgba(0,255,136,0.3);transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.link{text-align:center;margin-top:1.8rem;font-size:0.88rem;color:var(--muted)}
.link a{color:var(--green);text-decoration:none;font-weight:600;transition:color 0.2s}
.link a:hover{color:var(--green-dim)}
.footer{text-align:center;margin-top:2rem;color:var(--muted);font-size:0.75rem}
.footer a{color:var(--muted);text-decoration:none}
.terms{font-size:0.75rem;color:var(--muted);text-align:center;margin-top:1rem;line-height:1.5}
.terms a{color:var(--green);text-decoration:none}
</style>
</head>
<body>
<div class="container">
<div class="logo-section">
<div class="logo-icon">N</div>
<h1>NELCi <span>Tech 3D</span></h1>
<p>Crie sua conta gratuita</p>
</div>
<div class="card">
<div id="error" class="error" style="display:none"></div>
<div id="success" class="success" style="display:none"></div>
<form id="regForm">
<div class="field">
<label>Nome completo</label>
<input type="text" name="name" required placeholder="Seu nome" autocomplete="name">
</div>
<div class="field">
<label>Email</label>
<input type="email" name="email" required placeholder="seu@email.com" autocomplete="email">
</div>
<div class="field">
<label>Senha</label>
<div class="pass-wrap">
<input type="password" name="password" id="regPass" required placeholder="Minimo 6 caracteres" minlength="6" autocomplete="new-password">
<button type="button" class="pass-toggle" onclick="var p=document.getElementById('regPass');var s=this;p.type=p.type==='password'?'text':'password';s.textContent=p.type==='password'?'👁':'🙈'">&#128065;</button>
</div>
</div>
<button type="submit" class="btn">Criar conta</button>
</form>
<p class="terms">Ao criar sua conta voce concorda com os <a href="#">Termos de Uso</a></p>
<p class="link">Ja tem conta? <a href="/login.html">Fazer login</a></p>
</div>
<div class="footer">NELCi Tech 3D &copy; 2026 &mdash; <a href="index.html">Voltar ao site</a></div>
</div>
<script>
const p=new URLSearchParams(location.search);
if(p.get('error')){const e=document.getElementById('error');e.textContent=decodeURIComponent(p.get('error'));e.style.display='flex'}
document.getElementById('regForm').onsubmit=function(ev){
  ev.preventDefault();
  var fd=new FormData(this);
  var btn=this.querySelector('button');
  btn.textContent='Criando...';btn.disabled=true;
  fetch('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:fd.get('name'),email:fd.get('email'),password:fd.get('password')})})
  .then(function(r){return r.json().then(function(d){return{status:r.status,data:d}})})
  .then(function(o){
    if(o.data.redirect){if(o.data.token)localStorage.setItem('nelci_token',o.data.token);window.location.href=o.data.redirect;}
    else{var e=document.getElementById('error');e.textContent=o.data.error||'Erro ao cadastrar';e.style.display='flex';btn.textContent='Criar conta';btn.disabled=false;}
  }).catch(function(){btn.textContent='Criar conta';btn.disabled=false;});
};
</script>
</body>
</html>
